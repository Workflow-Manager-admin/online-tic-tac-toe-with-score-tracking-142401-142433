<div class="leaderboard-container">
  <h2>Leaderboard</h2>
  <div *ngIf="loading">Loading...</div>
  <table *ngIf="!loading">
    <thead>
      <tr>
        <th>Rank</th>
        <th>Username</th>
        <th>Wins</th>
        <th>Games Played</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let entry of leaderboard; index as i">
        <td>{{ i + 1 }}</td>
        <td>{{ entry.username }}</td>
        <td>{{ entry.wins }}</td>
        <td>{{ entry.games }}</td>
      </tr>
    </tbody>
  </table>
  <a routerLink="/game">Back to Game</a>
</div>
